version: 2.1

parameters:
  run_release_checks:
    type: boolean
    default: false

commands:
  setup-linux-cross-toolchains:
    steps:
      - run:
          name: Install Linux, Android, and Windows-target cross-toolchains (Linux host)
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal --component rustfmt --component clippy
            fi
            source "$HOME/.cargo/env"
            rustup toolchain install stable --profile minimal --component rustfmt --component clippy
            rustup default stable
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            sudo apt-get update
            sudo apt-get install -y clang mingw-w64 binutils-x86-64-linux-gnu
            sdkmanager --licenses < <(yes)
            sdkmanager --install "ndk;27.2.12479018"
            ndk_clang="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            test -x "$ndk_clang"
            {
              echo "export ONE_ANDROID_CLANG=$ndk_clang"
              echo "export ONE_WINDOWS_CLANG=clang"
            } >> "$BASH_ENV"
            echo "Android NDK clang: $ndk_clang"
            clang --version
            x86_64-w64-mingw32-gcc --version

jobs:
  one-linux:
    machine:
      image: android:default
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - one-cargo-v1-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
            - one-cargo-v1-{{ arch }}-
      - setup-linux-cross-toolchains
      - run:
          name: Rust toolchain
          command: |
            rustc --version
            cargo --version
            python3 --version
      - run:
          name: Contract artifacts
          command: python3 tools/check_contract.py
      - run:
          name: Build
          command: cargo build --locked --workspace --all-targets
      - run:
          name: Clippy
          command: |
            cargo clippy --locked --workspace --all-targets -- -D warnings
      - run:
          name: Workspace tests
          command: cargo test --locked --workspace --all-targets
      - run:
          name: Deterministic .oneir and .onepkg artifacts
          command: cargo test --locked -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic
      - run:
          name: DNS success and failure classification
          command: |
            cargo test --locked -p one-core --all-targets dns_adapter
      - run:
          name: Orchestration policy deny and allow paths
          command: |
            cargo test --locked -p one-core --all-targets orchestrator
      - run:
          name: Database vertical slice
          command: |
            cargo test --locked -p one-core --test database_vertical_slice
      - run:
          name: HTTP GET vertical slice
          command: |
            cargo test --locked -p one-core --test http_get_vertical_slice
      - run:
          name: HTTP GET CLI vertical slice
          command: |
            cargo test --locked -p one-cli --test http_get_orchestration
      - save_cache:
          key: one-cargo-v1-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

  release-linux:
    machine:
      image: android:default
    resource_class: large
    steps:
      - checkout
      - setup-linux-cross-toolchains
      - run:
          name: Toolchain and contract artifacts
          command: |
            rustc --version
            cargo --version
            python3 --version
            python3 tools/check_contract.py
      - run:
          name: Build
          command: cargo build --locked --workspace --all-targets
      - run:
          name: Clippy
          command: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run:
          name: Workspace tests
          command: cargo test --locked --workspace --all-targets
      - run:
          name: Real network runtime tests
          command: cargo test --locked -p one-core --features real-network --all-targets
      - run:
          name: Offline verification
          command: bash tools/verify_offline.sh

workflows:
  one-ci:
    jobs:
      - one-linux

  release-check:
    when: << pipeline.parameters.run_release_checks >>
    jobs:
      - release-linux
