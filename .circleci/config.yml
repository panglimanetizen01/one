version: 2.1

parameters:
  run_release_checks:
    type: boolean
    default: false

commands:
  setup-linux-cross-toolchains:
    steps:
      - run:
          name: Install Linux, Android, and Windows-target cross-toolchains (Linux host)
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 20 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            fi
            source "$HOME/.cargo/env"
            rust_toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
            if [[ ! "$rust_toolchain" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "rust-toolchain.toml must pin an exact x.y.z release" >&2
              exit 1
            fi
            rustup toolchain install "$rust_toolchain" --profile minimal --component rustfmt --component clippy
            rustup default "$rust_toolchain"
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            # The CircleCI Android machine image may point Noble at a regional
            # GCE mirror whose package indexes and pool files briefly diverge.
            # Use Ubuntu's canonical archive so apt does not request stale
            # package versions from that regional mirror.
            sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' \) \
              -exec sed -i 's/us-east1.gce.archive.ubuntu.com/archive.ubuntu.com/g' {} +
            sudo apt-get clean
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300)
            timeout 5m sudo apt-get "${apt_opts[@]}" update
            # Install only the x86_64 POSIX MinGW runtime/toolchain needed by
            # native_backend_linux_windows.rs. The mingw-w64 meta-package also
            # pulls unrelated architectures and thread models, increasing
            # install time and the chance of CI timeout/package-mirror failures.
            timeout 15m sudo apt-get "${apt_opts[@]}" install -y --no-install-recommends clang gcc-mingw-w64-x86-64-posix binutils-x86-64-linux-gnu
            sdkmanager --licenses < <(yes)
            sdkmanager --install "ndk;27.2.12479018"
            ndk_clang="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            test -x "$ndk_clang"
            {
              echo "export ONE_ANDROID_CLANG=$ndk_clang"
              echo "export ONE_WINDOWS_CLANG=clang"
            } >> "$BASH_ENV"
            echo "Android NDK clang: $ndk_clang"
            clang --version
            x86_64-w64-mingw32-gcc-posix --version

jobs:
  one-linux:
    machine:
      image: android:default
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - one-cargo-v2-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
            - one-cargo-v1-{{ arch }}-
      - setup-linux-cross-toolchains
      - run:
          name: Rust toolchain
          command: |
            rustc --version
            cargo --version
            python3 --version
      - run:
          name: Contract artifacts
          command: python3 tools/check_contract.py
      - run:
          name: User documentation consistency
          command: python3 tools/check_user_docs.py
      - run:
          name: User documentation checker tests
          command: python3 tools/check_user_docs_test.py
      - run:
          name: Build
          command: cargo build --locked --workspace --all-targets
      - run:
          name: Clippy
          command: |
            cargo clippy --locked --workspace --all-targets -- -D warnings
      - run:
          name: Workspace tests
          command: cargo test --locked --workspace --all-targets
      - run:
          name: Focused test diagnostics (only after an earlier CI failure)
          when: on_fail
          command: |
            set -uo pipefail
            status=0
            run_diagnostic() {
              label="$1"
              shift
              echo "=== $label ==="
              "$@" || status=1
            }
            # These exact tests already run in the successful full workspace
            # suite above. Re-run them only after a failure, for focused logs.
            run_diagnostic "Deterministic .oneir and .onepkg artifacts" cargo test --locked -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic
            run_diagnostic "DNS success and failure classification" cargo test --locked -p one-core --all-targets dns_adapter
            run_diagnostic "Orchestration policy deny and allow paths" cargo test --locked -p one-core --all-targets orchestrator
            run_diagnostic "Database vertical slice" cargo test --locked -p one-core --test database_vertical_slice
            run_diagnostic "HTTP GET vertical slice" cargo test --locked -p one-core --test http_get_vertical_slice
            run_diagnostic "HTTP GET CLI vertical slice" cargo test --locked -p one-cli --test http_get_orchestration
            exit "$status"
      - run:
          name: Build release CLI
          command: cargo build --release --locked -p one-cli --bin one
      - run:
          name: Smoke-test release CLI
          command: |
            set -euo pipefail
            binary=target/release/one
            test -x "$binary"
            version=$("$binary" version)
            test "$version" = "one 0.1.0"
            temp_dir=$(mktemp -d)
            trap 'rm -rf "$temp_dir"' EXIT
            printf '%s\n' 'nama adalah "Budi"' 'tampilkan nama' > "$temp_dir/halo.one"
            output=$("$binary" jalankan "$temp_dir/halo.one")
            test "$output" = "Budi"
      - when:
          condition: << pipeline.parameters.run_release_checks >>
          steps:
            - run:
                name: Real network runtime tests (release gate)
                command: cargo test --locked -p one-core --features real-network --all-targets
            - run:
                name: Offline verification (release gate)
                command: bash tools/verify_offline.sh
      - save_cache:
          key: one-cargo-v2-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

workflows:
  one-ci:
    when: not pipeline.parameters.run_release_checks
    jobs:
      - one-linux

  release-check:
    when: pipeline.parameters.run_release_checks
    jobs:
      - one-linux
