version: 2.1

parameters:
  run_release_checks:
    type: boolean
    default: false

commands:
  setup-linux-cross-toolchains:
    steps:
      - run:
          name: Install Linux and Windows-target cross-toolchains (Linux host)
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            # The CircleCI Android machine image may point Noble at a regional
            # GCE mirror whose package indexes and pool files briefly diverge.
            # Use Ubuntu's canonical archive so apt does not request stale
            # package versions from that regional mirror.
            sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' \) \
              -exec sed -i 's/us-east1.gce.archive.ubuntu.com/archive.ubuntu.com/g' {} +
            sudo apt-get clean
            apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=300)
            timeout 5m sudo apt-get "${apt_opts[@]}" update

            # Install package groups independently. The previous combined
            # install exhausted its 40-minute command deadline after package
            # setup/trigger output. Separate groups and failure diagnostics
            # identify whether Clang or MinGW/dpkg processing is the blocker.
            install_apt_group() {
              local label="$1"
              shift
              local started="$SECONDS"
              local status=0
              echo "=== APT INSTALL START: $label (UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
              local monitor_log
              local install_pid
              local monitor_pid
              monitor_log="$(mktemp "/tmp/one-apt-monitor.XXXXXX")"

              # Keep a low-noise process-state history while APT runs. The
              # post-timeout snapshot alone cannot show what APT was waiting
              # on because GNU timeout has already terminated its process.
              timeout 25m sudo env DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y --no-install-recommends "$@" &
              install_pid=$!
              (
                while kill -0 "$install_pid" 2>/dev/null; do
                  {
                    echo "=== LIVE APT PROCESS SNAPSHOT (UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
                    ps -eo pid,ppid,stat,wchan:32,etime,comm,args | awk '$6 ~ /^(apt-get|dpkg|debconf|needrestart|unattended-upgrade|sudo|timeout)$/ { print }'
                    for proc in /proc/[0-9]*; do
                      [[ -r "$proc/comm" ]] || continue
                      comm="$(cat "$proc/comm" 2>/dev/null || true)"
                      case "$comm" in
                        apt-get|dpkg|debconf|needrestart|unattended-upgrade|sudo|timeout)
                          printf 'PID %s COMM %s WCHAN ' "${proc##*/}" "$comm"
                          cat "$proc/wchan" 2>/dev/null || true
                          printf 'CMD '
                          tr '\0' ' ' < "$proc/cmdline" 2>/dev/null || true
                          printf '\\n'
                          ;;
                      esac
                    done
                  } >> "$monitor_log" 2>&1
                  sleep 120
                done
              ) &
              monitor_pid=$!

              if wait "$install_pid"; then
                status=0
              else
                status=$?
              fi
              kill "$monitor_pid" 2>/dev/null || true
              wait "$monitor_pid" 2>/dev/null || true

              if [[ "$status" -eq 0 ]]; then
                echo "=== APT INSTALL COMPLETE: $label; elapsed $((SECONDS - started))s (UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
                rm -f "$monitor_log"
                return 0
              fi

              echo "=== APT INSTALL FAILED: $label; exit $status; elapsed $((SECONDS - started))s (UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)) ==="
              echo "=== LIVE APT PROCESS HISTORY (captured every 120s) ==="
              cat "$monitor_log" || true
              rm -f "$monitor_log"
              echo "=== dpkg audit ==="
              sudo dpkg --audit || true
              echo "=== apt/dpkg/debconf process snapshot after timeout ==="
              ps -eo pid,ppid,stat,wchan:32,etime,comm,args | grep -E '(^|[[:space:]])(apt-get|dpkg|debconf|needrestart|unattended-upgrade|sudo|timeout)([[:space:]]|$)' || true
              echo "=== APT terminal log tail ==="
              sudo tail -n 160 /var/log/apt/term.log || true
              echo "=== APT history log tail ==="
              sudo tail -n 80 /var/log/apt/history.log || true
              echo "=== dpkg log tail ==="
              sudo tail -n 100 /var/log/dpkg.log || true
              return "$status"
            }

            install_apt_group "Clang and Linux binutils" clang binutils-x86-64-linux-gnu
            install_apt_group "x86_64 POSIX MinGW" gcc-mingw-w64-x86-64-posix

            {
              echo "export ONE_WINDOWS_CLANG=clang"
            } >> "$BASH_ENV"
            echo "Linux and Windows cross-toolchains installed."
            clang --version
            x86_64-w64-mingw32-gcc-posix --version

      - run:
          name: Accept Android SDK licenses
          no_output_timeout: 6m
          command: |
            set -euo pipefail
            echo "Accepting Android SDK licenses..."
            timeout 5m sdkmanager --licenses < <(yes)
            echo "Android SDK licenses accepted."

      - run:
          name: Install Android NDK 27.2.12479018
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            echo "Installing Android NDK 27.2.12479018 (verbose progress enabled)..."
            timeout 15m sdkmanager --install --verbose "ndk;27.2.12479018"
            ndk_clang="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
            test -x "$ndk_clang"
            {
              echo "export ONE_ANDROID_CLANG=$ndk_clang"
            } >> "$BASH_ENV"
            echo "Android NDK clang: $ndk_clang"
            clang --version

jobs:
  one-linux:
    machine:
      image: android:default
    resource_class: large
    steps:
      - checkout
      - run:
          name: CircleCI diagnostic utility tests
          command: python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - restore_cache:
          keys:
            - one-cargo-v2-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
            - one-cargo-v1-{{ arch }}-
      - run:
          name: Install pinned Rust toolchain
          no_output_timeout: 12m
          command: |
            set -euo pipefail
            if ! command -v rustup >/dev/null 2>&1; then
              echo "Bootstrapping rustup..."
              timeout 5m bash -o pipefail -c "curl --proto '=https' --tlsv1.2 --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 20 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal"
            fi
            source "$HOME/.cargo/env"
            rust_toolchain="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)"
            if [[ ! "$rust_toolchain" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
              echo "rust-toolchain.toml must pin an exact x.y.z release" >&2
              exit 1
            fi
            echo "Installing pinned Rust toolchain $rust_toolchain..."
            timeout 10m rustup toolchain install "$rust_toolchain" --profile minimal --component rustfmt --component clippy
            rustup default "$rust_toolchain"
            echo 'source "$HOME/.cargo/env"' >> "$BASH_ENV"
            echo "Pinned Rust toolchain installed."

      - setup-linux-cross-toolchains
      - run:
          name: Rust toolchain
          command: |
            rustc --version
            cargo --version
            python3 --version
      - run:
          name: Contract artifacts
          command: python3 tools/check_contract.py
      - run:
          name: User documentation consistency
          command: python3 tools/check_user_docs.py
      - run:
          name: User documentation checker tests
          command: python3 tools/check_user_docs_test.py
      - run:
          name: Build
          command: cargo build --locked --workspace --all-targets
      - run:
          name: Clippy
          command: |
            cargo clippy --locked --workspace --all-targets -- -D warnings
      - run:
          name: Workspace tests
          command: cargo test --locked --workspace --all-targets
      - run:
          name: Build release CLI
          command: cargo build --release --locked -p one-cli --bin one
      - run:
          name: Smoke-test release CLI
          command: |
            set -euo pipefail
            binary=target/release/one
            test -x "$binary"
            version=$("$binary" version)
            test "$version" = "one 0.1.0"
            temp_dir=$(mktemp -d)
            trap 'rm -rf "$temp_dir"' EXIT
            printf '%s\n' 'nama adalah "Budi"' 'tampilkan nama' > "$temp_dir/halo.one"
            output=$("$binary" jalankan "$temp_dir/halo.one")
            test "$output" = "Budi"
      - run:
          name: Require native Linux nested filesystem confinement
          command: |
            set -euo pipefail
            test_binary="$(find target/debug/build/one-core -type f -name 'one_core-*' -perm -u+x -print -quit)"
            if [[ -z "$test_binary" || ! -x "$test_binary" ]]; then
              echo "The one-core unit-test binary was not produced by the workspace test step." >&2
              exit 1
            fi
            echo "Running native nested-write adversarial tests as root: $test_binary"
            sudo -n env ONE_REQUIRE_NATIVE_LINUX_NESTED_WRITE=1 "$test_binary" --exact filesystem::tests::nested_atomic_write_uses_detached_mount_and_rejects_parent_move --nocapture
            sudo -n env ONE_REQUIRE_NATIVE_LINUX_NESTED_WRITE=1 "$test_binary" --exact filesystem::tests::nested_write_rejects_mount_boundary_before_creating_staging_file --nocapture

      - when:
          condition: << pipeline.parameters.run_release_checks >>
          steps:
            - run:
                name: Real network runtime tests (release gate)
                command: cargo test --locked -p one-core --features real-network --all-targets
            - run:
                name: Offline verification (release gate)
                command: bash tools/verify_offline.sh
      - run:
          name: Focused test diagnostics (only after an earlier CI failure)
          when: on_fail
          command: |
            set -uo pipefail
            if [[ ! -f Cargo.toml ]] || ! command -v cargo >/dev/null 2>&1 || ! cargo --version >/dev/null 2>&1; then
              echo "Skipping focused Rust diagnostics: the workspace or Cargo toolchain is unavailable after the earlier CI failure."
              exit 0
            fi
            status=0
            run_diagnostic() {
              label="$1"
              shift
              echo "=== $label ==="
              "$@" || status=1
            }
            # These exact tests already run in the successful full workspace
            # suite above. Re-run them only after a failure, for focused logs.
            run_diagnostic "Deterministic .oneir and .onepkg artifacts" cargo test --locked -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic
            run_diagnostic "DNS success and failure classification" cargo test --locked -p one-core --all-targets dns_adapter
            run_diagnostic "Orchestration policy deny and allow paths" cargo test --locked -p one-core --all-targets orchestrator
            run_diagnostic "Database vertical slice" cargo test --locked -p one-core --test database_vertical_slice
            run_diagnostic "HTTP GET vertical slice" cargo test --locked -p one-core --test http_get_vertical_slice
            run_diagnostic "HTTP GET CLI vertical slice" cargo test --locked -p one-cli --test http_get_orchestration
            exit "$status"
      - save_cache:
          key: one-cargo-v2-{{ arch }}-{{ checksum "Cargo.toml" }}-{{ checksum "Cargo.lock" }}-{{ checksum "crates/one-core/Cargo.toml" }}-{{ checksum "crates/one-cli/Cargo.toml" }}-{{ checksum "rust-toolchain.toml" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git

workflows:
  one-ci:
    when: not pipeline.parameters.run_release_checks
    jobs:
      - one-linux

  release-check:
    when: pipeline.parameters.run_release_checks
    jobs:
      - one-linux
