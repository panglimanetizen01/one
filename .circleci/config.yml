version: 2.1

jobs:
  linux-verify:
    docker:
      - image: rust:1.99.1-bookworm
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install repository verification prerequisites and native toolchains
          command: |
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3 clang curl ca-certificates unzip file \
              gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

            NDK_ARCHIVE="/tmp/android-ndk-r30-linux.zip"
            curl -fsSL --retry 3 --retry-delay 2 \
              "https://dl.google.com/android/repository/android-ndk-r30-linux.zip" \
              -o "$NDK_ARCHIVE"
            printf '%s  %s\n' \
              '5107f898313790e449e87eee2183d9a20602dee9' "$NDK_ARCHIVE" | sha1sum --check -
            unzip -q "$NDK_ARCHIVE" -d /opt
            rm -f "$NDK_ARCHIVE"

            ANDROID_CLANG="/opt/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
            MINGW_SYSROOT="/usr/x86_64-w64-mingw32"
            MINGW_LD="$(command -v x86_64-w64-mingw32-ld)"
            test -x "$ANDROID_CLANG"
            test -d "$MINGW_SYSROOT/include"

            printf '%s\n' \
              '#!/bin/sh' \
              'if [ "${1:-}" = "--target=x86_64-w64-windows-gnu" ]; then shift; fi' \
              'exec /usr/bin/x86_64-w64-mingw32-gcc "$@"' \
              > /usr/local/bin/one-windows-clang
            chmod 0755 /usr/local/bin/one-windows-clang

            printf 'export ONE_ANDROID_CLANG="%s"\n' "$ANDROID_CLANG" >> "$BASH_ENV"
            printf 'export ONE_WINDOWS_CLANG="%s"\n' "/usr/local/bin/one-windows-clang" >> "$BASH_ENV"

            printf '#include <stdio.h>\nint main(void) { puts("toolchain-ok"); return 0; }\n' > /tmp/one-native-toolchain-probe.c
            "$ANDROID_CLANG" /tmp/one-native-toolchain-probe.c -o /tmp/one-native-android-probe
            /usr/local/bin/one-windows-clang /tmp/one-native-toolchain-probe.c -o /tmp/one-native-windows-probe.exe
            file /tmp/one-native-android-probe | grep -q 'ARM aarch64'
            file /tmp/one-native-windows-probe.exe | grep -q 'PE32+ executable'

            rustc --version
            cargo --version
            python3 --version
            clang --version
            "$ANDROID_CLANG" --version
            x86_64-w64-mingw32-ld --version

      - run:
          name: Validate repository contracts and user documentation
          command: |
            python3 tools/check_user_docs.py
            python3 tools/check_user_docs_test.py

      - run:
          name: Verify ONE product CI contracts
          command: python3 -m unittest discover -s tests -p test_product_ci_contract.py -v

      - run:
          name: Run ONE product checks directly
          command: |
            set -euo pipefail
            python3 tools/check_contract.py
            cargo --locked build --workspace --all-targets
            cargo clippy --locked --workspace --all-targets -- -D warnings
            cargo --locked test --workspace --all-targets
            cargo --locked test -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic
            cargo --locked test -p one-core --all-targets dns_adapter
            cargo --locked test -p one-core --all-targets orchestrator
            cargo --locked test -p one-core --test database_vertical_slice
            cargo --locked test -p one-core --test http_get_vertical_slice
            cargo --locked test -p one-cli --test http_get_orchestration

      - run:
          name: Build standalone trusted CLI and enforce single link
          command: |
            CARGO_TARGET_DIR=target/one-health-cli cargo --locked build -p one-cli
            mkdir -p target/debug
            rm -f target/debug/one
            cp target/one-health-cli/debug/one target/debug/one
            python3 -c 'import os,sys; p=sys.argv[1]; n=os.stat(p).st_nlink; print("trusted CLI hard-link count:", n); sys.exit(0 if n == 1 else 1)' target/debug/one

workflows:
  one-linux-verification:
    jobs:
      - linux-verify
