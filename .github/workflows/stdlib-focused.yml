name: ONE Standard Library Focused Verification

on:
  push:
    branches: [ milestone/100-ecosystem-20261023 ]
    paths:
      - "crates/one-core/src/stdlib.rs"
      - "crates/one-core/src/semantic.rs"
      - "crates/one-core/src/interpreter.rs"
      - "crates/one-core/tests/stdlib_builtins.rs"
      - ".github/workflows/stdlib-focused.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "crates/one-core/src/stdlib.rs"
      - "crates/one-core/src/semantic.rs"
      - "crates/one-core/src/interpreter.rs"
      - "crates/one-core/tests/stdlib_builtins.rs"
      - ".github/workflows/stdlib-focused.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-stdlib-focused-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stdlib:
    name: UTC and deterministic stdlib regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: UTC formatter unit and calendar-boundary tests
        run: cargo test -p one-core --lib unix_seconds_format_as_valid_bounded_gregorian_utc_timestamps
      - name: Source-level UTC formatter integration tests
        run: cargo test -p one-core --test stdlib_builtins unix_timestamp_formatter_runs_through_the_canonical_pipeline
      - name: Standard-library lint
        run: cargo clippy -p one-core --all-targets -- -D warnings
