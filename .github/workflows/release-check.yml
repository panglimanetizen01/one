name: One v0.1 Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: release-check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline verification contract
        run: bash tools/verify_offline.sh

  windows:
    name: release-check (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Run offline verification contract
        shell: pwsh
        run: ./tools/verify_offline.ps1
