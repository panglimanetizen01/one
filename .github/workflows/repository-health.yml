name: One Repository Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-repository-health-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  repository-health:
    name: Integrity scanner and regression fixtures
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scanner regression tests
        run: python -m unittest discover -s tools -p "test_one_health.py" -v

      - name: Scan repository integrity
        run: python tools/one_health.py --json-out one-health-report.json --markdown-out one-health-report.md --quiet

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-health-report-${{ runner.os }}
          path: |
            one-health-report.json
            one-health-report.md
          if-no-files-found: warn
          retention-days: 14
