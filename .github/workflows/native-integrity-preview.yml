name: Native integrity preview

on:
  push:
    branches:
      - architecture/native-integrity-engine
  pull_request:
    branches:
      - milestone/100-ecosystem-20261023

permissions:
  contents: read

jobs:
  native-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust toolchain
        run: rustc --version && cargo --version
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Native scanner unit tests
        run: cargo test --locked -p one-cli --bin one integrity::tests
      - name: Clippy
        run: cargo clippy --locked -p one-cli --all-targets -- -D warnings
      - name: Native scanner self-scan
        shell: bash
        run: cargo run --locked -p one-cli --bin one -- pindai --scope all --root . --expected-sha "$GITHUB_SHA"
