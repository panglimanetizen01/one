name: Windows Native Verification

on:
  workflow_dispatch:

jobs:
  windows-native-verification:
    runs-on: windows-2025
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Verify Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected AMD64 Windows runner."
          }

      - name: Verify Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustc --version
          cargo --version
          cargo clippy --version

      - name: Build and test One
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo build -p one-cli --bin one-native --locked

      - name: Build Windows native target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo run -p one-cli --bin one-native --locked -- build --target windows-x86_64 examples/hello.one one-windows-native.exe
          if (-not (Test-Path one-windows-native.exe)) {
            throw 'Windows native artifact was not produced.'
          }

      - name: Inspect Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [System.IO.File]::ReadAllBytes('one-windows-native.exe')
          if ($bytes.Length -lt 64) {
            throw 'Artifact is too small to be a PE executable.'
          }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Artifact does not have a PE MZ header.'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 24 -gt $bytes.Length) {
            throw 'Invalid PE header offset.'
          }
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or $bytes[$peOffset + 2] -ne 0x00 -or $bytes[$peOffset + 3] -ne 0x00) {
            throw 'Missing PE signature.'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) {
            throw ("Expected AMD64 PE machine 0x8664, got 0x{0:X4}." -f $machine)
          }
          Write-Host 'PE32+ AMD64 artifact verified.'

      - name: Execute Windows native artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\one-windows-native.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Windows native artifact exited with code $LASTEXITCODE."
          }

      - name: Upload Windows verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-verification
          path: one-windows-native.exe
          if-no-files-found: ignore
