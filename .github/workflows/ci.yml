name: One CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install cross-compilers (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mingw-w64
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          echo "ONE_WINDOWS_CLANG=clang" >> "$GITHUB_ENV"
      - name: Install cross-compilers (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-clang mingw-w64-x86_64-toolchain
      - name: Install Android NDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          sdkmanager --install "ndk;27.2.12479018"
          $clang = Join-Path $env:ANDROID_HOME "ndk\\27.2.12479018\\toolchains\\llvm\\prebuilt\\windows-x86_64\\bin\\clang.exe"
          "ONE_ANDROID_CLANG=$clang" >> $env:GITHUB_ENV
          "ONE_WINDOWS_CLANG=clang" >> $env:GITHUB_ENV
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Contract artifacts
        run: python tools/check_contract.py
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      - name: Deterministic .oneir and .onepkg artifacts
        run: cargo test --locked -p one-cli --test cli build_and_package_artifacts_are_byte_deterministic
      - name: DNS success and failure classification
        run: cargo test --locked -p one-core --all-targets dns_adapter
      - name: Orchestration policy deny and allow paths
        run: cargo test --locked -p one-core --all-targets orchestrator
      - name: Database vertical slice
        run: cargo test --locked -p one-core --test database_vertical_slice
      - name: HTTP GET vertical slice
        run: cargo test --locked -p one-core --test http_get_vertical_slice
      - name: HTTP GET CLI vertical slice
        run: cargo test --locked -p one-cli --test http_get_orchestration
      - name: Build release CLI
        run: cargo build --release --locked -p one-cli --bin one
      - name: Smoke-test release CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/one
          test -x "$binary"
          version=$("$binary" version)
          test "$version" = "one 0.1.0"
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cat > "$temp_dir/halo.one" <<'ONE'
          nama adalah "Budi"
          tampilkan nama
          ONE
          output=$("$binary" jalankan "$temp_dir/halo.one")
          test "$output" = "Budi"
      - name: Smoke-test release CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Join-Path $PWD 'target/release/one.exe'
          if (-not (Test-Path $binary)) { throw 'Release CLI binary was not produced.' }
          $version = & $binary version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'one 0.1.0') { throw "Unexpected CLI version output: $version" }
          $tempDir = Join-Path $env:RUNNER_TEMP ("one-cli-smoke-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempDir | Out-Null
          try {
            $source = Join-Path $tempDir 'halo.one'
            [System.IO.File]::WriteAllText($source, "nama adalah `"Budi`"`ntampilkan nama`n", [System.Text.UTF8Encoding]::new($false))
            $output = & $binary jalankan $source
            if ($LASTEXITCODE -ne 0 -or (($output -join "`n").Trim() -ne 'Budi')) { throw "CLI smoke test failed: $output" }
          } finally {
            Remove-Item -LiteralPath $tempDir -Recurse -Force
          }
