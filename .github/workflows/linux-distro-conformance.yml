name: ONE Linux Distribution Conformance

on:
  push:
    branches: [ milestone/100-ecosystem-20261023 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-linux-distro-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install native target toolchains
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/one-windows-compiler" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "--target=x86_64-w64-windows-gnu" ]]; then args+=("$arg"); fi
          done
          exec x86_64-w64-mingw32-gcc "${args[@]}"
          WRAPPER
          chmod +x "$RUNNER_TEMP/one-windows-compiler"
          echo "ONE_WINDOWS_CLANG=$RUNNER_TEMP/one-windows-compiler" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Record environment
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          python3 --version
      - name: Contract checks
        run: python3 tools/check_contract.py
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Real-network tests
        run: cargo test -p one-core --features real-network --all-targets

  debian:
    name: Debian 12 container
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git unzip python3 build-essential pkg-config clang gcc-mingw-w64-x86-64 openjdk-17-jdk
      - uses: actions/checkout@v4
      - name: Configure Java 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android NDK and configure Windows compiler
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "ndk;27.2.12479018"
          echo "ONE_ANDROID_CLANG=$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/one-windows-compiler" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          args=()
          for arg in "$@"; do
            if [[ "$arg" != "--target=x86_64-w64-windows-gnu" ]]; then args+=("$arg"); fi
          done
          exec x86_64-w64-mingw32-gcc "${args[@]}"
          WRAPPER
          chmod +x "$RUNNER_TEMP/one-windows-compiler"
          echo "ONE_WINDOWS_CLANG=$RUNNER_TEMP/one-windows-compiler" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Record environment
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          python3 --version
      - name: Contract checks
        run: python3 tools/check_contract.py
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --all-targets
      - name: Real-network tests
        run: cargo test -p one-core --features real-network --all-targets
