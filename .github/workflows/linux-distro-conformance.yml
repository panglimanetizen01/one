name: ONE Linux Distribution Conformance

on:
  push:
    branches: [ milestone/100-ecosystem-20261023 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-linux-distro-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu ${{ matrix.version }}
    runs-on: ubuntu-${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: ["24.04"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Record environment
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          python3 --version
      - name: Contract checks
        run: python3 tools/check_contract.py
      - name: Build
        run: cargo --locked build --workspace --all-targets
      - name: Clippy
        run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (target-toolchain cases run in cross-platform matrix)
        run: cargo --locked test --workspace --all-targets -- --skip windows_x86_64_target_mempertahankan_build_native --skip android_target_explicit_mempertahankan_build_native --skip windows_x86_64_dapat_membangun_artifact_native
      - name: Real-network tests (native distro; target-toolchain case covered separately)
        shell: bash
        run: cargo --locked test -p one-core --features real-network --all-targets -- --skip windows_x86_64_dapat_membangun_artifact_native

  debian:
    name: Debian 12 container
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    steps:
      - name: Install base tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates curl git python3 build-essential pkg-config clang
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy
      - name: Record environment
        run: |
          cat /etc/os-release
          rustc --version
          cargo --version
          python3 --version
      - name: Contract checks
        run: python3 tools/check_contract.py
      - name: Build
        run: cargo --locked build --workspace --all-targets
      - name: Clippy
        run: cargo --locked clippy --workspace --all-targets -- -D warnings
      - name: Workspace tests (native distro; target-toolchain cases covered separately)
        shell: bash
        run: |
          set -euo pipefail
          cargo --locked test --workspace --all-targets -- --skip windows_x86_64_target_mempertahankan_build_native --skip android_target_explicit_mempertahankan_build_native --skip windows_x86_64_dapat_membangun_artifact_native
      - name: Real-network tests (native distro; target-toolchain case covered separately)
        shell: bash
        run: cargo --locked test -p one-core --features real-network --all-targets -- --skip windows_x86_64_dapat_membangun_artifact_native
