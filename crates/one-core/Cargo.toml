[package]
name = "one-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Core language implementation for One"

[lib]
name = "one_core"
path = "src/lib.rs"

[features]
default = []
real-network = ["dep:rustls", "dep:webpki-roots", "dep:quinn", "dep:tokio", "dep:rcgen", "dep:h2", "dep:bytes", "dep:http"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring"], optional = true }
webpki-roots = { version = "0.26", optional = true }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "io-util"], optional = true }
rcgen = { version = "0.13", optional = true }
h2 = { version = "0.4", optional = true }
bytes = { version = "1", optional = true }
http = { version = "1", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
] }
