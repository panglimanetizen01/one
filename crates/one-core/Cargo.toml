[package]
name = "one-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Core language implementation for One"

[lib]
name = "one_core"
path = "src/lib.rs"

[features]
default = []
real-network = ["dep:rustls", "dep:webpki-roots", "dep:quinn"]

[dependencies]
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }
quinn = { version = "0.11", optional = true }
